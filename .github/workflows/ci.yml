name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm pack
      - name: install from the tarball and run the CLI
        shell: bash
        run: |
          mkdir -p $RUNNER_TEMP/prefix && npm install -g --prefix $RUNNER_TEMP/prefix ./*.tgz
          BIN=$RUNNER_TEMP/prefix/bin/asset-optimizer; [ -f "$BIN" ] || BIN=$RUNNER_TEMP/prefix/asset-optimizer
          "$BIN" --help
          mkdir -p $RUNNER_TEMP/corpus && node -e "require('sharp')({create:{width:300,height:200,channels:3,background:'#123456'}}).png().toFile('$RUNNER_TEMP/corpus/a.png')"
          "$BIN" $RUNNER_TEMP/corpus --preset web --out $RUNNER_TEMP/out --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s);if(r.totals.images!==1)process.exit(1)})"
